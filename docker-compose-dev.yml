services:

    caddy:
        image: caddy:2.11
        ports:
            - "127.0.0.1:80:80"
            - "127.0.0.1:443:443"
        volumes:
            - ./caddy/Caddyfile:/etc/caddy/Caddyfile
            # Local CA and certificates: a new CA would need trusting again
            - caddy_data:/data
            - caddy_config:/config
        depends_on:
            - chimchar
            - ichiro
            - lonzo
            - nujabes

    chimchar:
        build:
            context: ./apps/chimchar
            dockerfile: Dockerfile.dev
        volumes:
            - ./apps/chimchar:/app
            - /app/node_modules
        environment:
            - CHOKIDAR_USEPOLLING=true

    ichiro:
        build:
            context: ./apps/ichiro
            dockerfile: Dockerfile.dev
        volumes:
            - ./apps/ichiro:/app
            - /app/.venv
        env_file: .env
        depends_on:
            - postgres

    lonzo:
        build:
            context: ./apps/lonzo
            dockerfile: Dockerfile.dev
        volumes:
            - ./apps/lonzo:/app
            - /app/.venv
        environment:
            - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
            - LONZO_DATABASE_URL=${LONZO_DATABASE_URL}
            - LONZO_MIGRATION_URL=${LONZO_MIGRATION_URL}
            - ICHIRO_URL=http://ichiro:8000
        depends_on:
            - ichiro
            - postgres

    nujabes:
        build:
            context: ./apps/nujabes
            dockerfile: Dockerfile.dev
        volumes:
            - ./apps/nujabes:/app
            - /app/.venv
        environment:
            - NUJABES_DATABASE_URL=${NUJABES_DATABASE_URL}
        depends_on:
            - postgres

    postgres:
        image: postgres:18
        command: postgres -c log_statement=all
        # Loopback only: lets the host run the tests and psql
        ports:
            - "127.0.0.1:5432:5432"
        env_file: .env
        volumes:
            - db:/var/lib/postgresql
            # Scripts run on the first start only (empty volume)
            - ./postgres/init:/docker-entrypoint-initdb.d


volumes:
    db:
    caddy_data:
    caddy_config:
