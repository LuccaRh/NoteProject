services:
  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile.dev
    ports:
      - "127.0.0.1:5173:5173"
    volumes:
      - ./apps/web:/app
      - /app/node_modules
    environment:
      - CHOKIDAR_USEPOLLING=true

  notes:
    build:
      context: ./apps/notes
      dockerfile: Dockerfile.dev
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./apps/notes:/app
      - /app/.venv
