# Vocabulário fechado de áreas do projeto (como o kb/temas.yaml das matérias).
# Toda tarefa, escopo de branch, nota e dúvida cai numa área. `./np contexto <área>` lista só
# o que ler para ela: código (com nº de linhas), notas do Obsidian, cards de lib e os commits
# recentes. Nada fora daqui entra no contexto sem motivo.
#
#   lado:     front | back | infra | workspace
#   codigo:   arquivos/pastas do repo (o lint confere que existem)
#   notas:    páginas em obsidian/ (cópia do vault Note Project/); o lint confere
#   libs:     cards em kb/libs/<nome>.md
#   aprender: true = área que o Lucca quer aprender fazendo (regra "Aprender fazendo" do CLAUDE.md)
#   futuro:   true = ainda não existe código; a área já tem nome para escopo e nota

editor:
  nome: Editor CodeMirror e decorações
  lado: front
  codigo: [apps/web/src/editor.ts, apps/web/src/decorations/]
  libs: [codemirror-view]
  notas: ["Conceitos/CodeMirror e decorações.md", "Estrutura do projeto/Marcador no texto, conteúdo fora.md"]

ui:
  nome: Moldura da interface (sidebar, palette, abas)
  lado: front
  codigo: [apps/web/src/main.ts, apps/web/src/style.css]

cliente-api:
  nome: Fronteira de rede do front (única)
  lado: front
  futuro: true

dados:
  nome: Modelo de dados (Postgres, pastas, campos, views)
  lado: back
  notas: ["Conceitos/Postgres e migrations.md", "Estrutura do projeto/Pastas, campos e views.md"]
  aprender: true
  futuro: true

sync:
  nome: Sync local-first (Yjs no cliente, CRDT no servidor, version incremental)
  notas: ["Conceitos/Local-first.md", "Conceitos/CRDT e Yjs.md", "Conceitos/WebSocket.md", "Conceitos/Sync por versão.md"]
  lado: back
  aprender: true
  futuro: true

servidor:
  nome: Servidor (FastAPI + Postgres; WebSocket e blobs depois)
  notas: ["Conceitos/FastAPI.md", "Conceitos/Python — módulo, package e venv.md", "Estrutura do projeto/API de notas.md", "Conceitos/Postgres e migrations.md", "Conceitos/S3 — armazenamento de objetos.md", "Conceitos/Redis pub-sub.md"]
  lado: back
  aprender: true
  futuro: true

auth:
  nome: Autenticação (cookie de sessão no navegador, TLS)
  notas: ["Conceitos/Token por dispositivo.md", "Conceitos/TLS e HTTPS.md"]
  lado: back
  aprender: true
  futuro: true

infra:
  nome: Containers, CI, deploy, proxy/TLS, backup, monitoramento
  notas: ["Conceitos/00 Mapa — Conceitos.md", "Conceitos/Container e Docker Compose.md", "Conceitos/Reverse proxy.md", "Conceitos/CI e CD.md"]
  lado: infra
  codigo: [docker-compose.yml, Makefile, .github/workflows/, apps/web/Dockerfile.dev]
  aprender: true

ia:
  nome: IA dentro do produto (MCP, fila de pedidos, edição por âncora)
  lado: back
  notas: ["IA no projeto/00 Mapa — IA no projeto.md", "IA no projeto/Ordem de implementação.md", "Conceitos/MCP.md"]
  futuro: true

workspace:
  nome: Este workspace de IA (CLAUDE.md, skills, tools)
  lado: workspace
  codigo: [CLAUDE.md, .claude/, ai/]
  notas: ["Workspace de IA/Como usar.md"]
