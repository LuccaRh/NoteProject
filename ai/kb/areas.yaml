# Vocabulário fechado de áreas do projeto (como o kb/temas.yaml das matérias).
# Toda tarefa, escopo de branch, nota e dúvida cai numa área. `./np contexto <área>` lista só
# o que ler para ela: código (com nº de linhas), notas do Obsidian, cards de lib e os commits
# recentes. Nada fora daqui entra no contexto sem motivo.
#
#   lado:     front | back | infra | workspace
#   codigo:   arquivos/pastas do repo (o lint confere que existem)
#   notas:    páginas em obsidian/ (cópia do vault Note Project/); o lint confere
#   libs:     cards em kb/libs/<nome>.md
#   aprender: true = área que o usuário quer aprender fazendo (regra "Aprender fazendo" do CLAUDE.md)
#   futuro:   true = ainda não existe código; a área já tem nome para escopo e nota

editor:
  nome: Editor CodeMirror e decorações
  lado: front
  codigo: [apps/chimchar/src/editor.ts, apps/chimchar/src/decorations/]
  libs: [codemirror-view]
  notas: ["Conceitos/Editor/CodeMirror.md", "Estrutura do projeto/Marcador no texto, conteúdo fora.md"]

ui:
  nome: Moldura da interface (sidebar, palette, abas)
  lado: front
  codigo: [apps/chimchar/src/main.ts, apps/chimchar/src/style.css]

cliente-api:
  nome: Fronteira de rede do front (única) — chamadas à API, proxy do Vite
  lado: front
  codigo: [apps/chimchar/src/notes/api.ts, apps/chimchar/vite.config.ts]
  aprender: true

dados:
  nome: Modelo de dados (Postgres, pastas, campos, views)
  lado: back
  notas: ["Conceitos/Banco de dados/Postgres.md", "Estrutura do projeto/Pastas, campos e views.md"]
  aprender: true
  futuro: true

sync:
  nome: Sync local-first (Yjs no cliente, CRDT no servidor, version incremental)
  notas: ["Conceitos/Sync/Local-first.md", "Conceitos/Sync/CRDT.md", "Conceitos/Sync/Yjs.md", "Conceitos/Sync/WebSocket.md", "Conceitos/Sync/Sync por versão.md"]
  lado: back
  aprender: true
  futuro: true

servidor:
  nome: Servidor (FastAPI + Postgres; WebSocket e blobs depois)
  notas: ["Conceitos/Python/FastAPI.md", "Conceitos/Python/Package Python.md", "Estrutura do projeto/API de notas.md", "Conceitos/Banco de dados/Postgres.md", "Conceitos/AWS/S3.md", "Conceitos/Sync/Redis pub-sub.md"]
  lado: back
  aprender: true
  futuro: true

auth:
  nome: Autenticação (cookie de sessão no navegador, TLS)
  notas: ["Conceitos/Auth/Token por dispositivo.md", "Conceitos/Rede/TLS.md"]
  lado: back
  aprender: true
  futuro: true

infra:
  nome: Containers, CI, deploy, proxy/TLS, backup, monitoramento
  notas: ["Conceitos/00 Mapa — Conceitos.md", "Conceitos/Docker/Docker Compose.md", "Conceitos/Rede/Reverse proxy.md", "Conceitos/Deploy/CI.md"]
  lado: infra
  codigo: [docker-compose-dev.yml, Makefile, .github/workflows/, apps/chimchar/Dockerfile.dev]
  aprender: true

ia:
  nome: IA dentro do produto (MCP, fila de pedidos, edição por âncora)
  lado: back
  codigo: [apps/lonzo/src/lonzo/routers/, apps/lonzo/src/lonzo/clients/, apps/lonzo/src/lonzo/schemas/, apps/lonzo/src/lonzo/create_workspace.md]
  libs: [anthropic, httpx2]
  notas: ["IA no projeto/00 Mapa — IA no projeto.md", "IA no projeto/Ordem de implementação.md", "IA no projeto/Caminho de uma pergunta.md", "IA no projeto/Workspace no app.md", "IA no projeto/Sem Claude Code — provedores.md", "Conceitos/IA/MCP.md"]

workspace:
  nome: Este workspace de IA (CLAUDE.md, skills, tools)
  lado: workspace
  codigo: [CLAUDE.md, .claude/, ai/]
  notas: ["Workspace de IA/Como usar.md"]
