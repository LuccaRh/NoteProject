titulo: "Plano (M3): o mesmo caminho em produção, na AWS"
tipo: blocos
grade: [330, 160]
destino: Plano do projeto/Issues feitas/Figuras
nos:
  nav:   {tipo: bloco, pos: [0, 0], texto: "navegador (qualquer lugar)<br>https://notes.&lt;domínio&gt;", cor: azul}
  dns:   {tipo: bloco, pos: [0, 2], texto: "DNS público<br>notes.&lt;domínio&gt; → IP da EC2", cor: roxo}
  sg:    {tipo: bloco, pos: [1, 1], texto: "security group da EC2<br>abre só 80 e 443<br>(5432 fechado)", cor: vermelho}
  gw:    {tipo: bloco, pos: [2, 1], texto: "EC2 na rede Docker<br>(gateway)", cor: roxo}
  cad:   {tipo: bloco, pos: [3, 0], texto: "<font style='font-size:15px'><b>caddy</b></font><br>:443<br>certificado Let's Encrypt<br>file_server do dist/", cor: vermelho}
  dist:  {tipo: bloco, pos: [4, 0], texto: "<font style='font-size:15px'><b>dist/</b></font><br>build do chimchar<br>dentro da imagem do Caddy<br>sem Vite · #47", cor: azul}
  api:   {tipo: bloco, pos: [4, 1], texto: "<font style='font-size:15px'><b>ichiro</b></font><br>:8000<br>FastAPI (sem reload)<br>sem porta publicada", cor: verde}
  db:    {tipo: banco, pos: [4, 2], texto: "<font style='font-size:15px'><b>postgres</b></font><br>:5432<br>volume no disco (EBS)<br>sem porta publicada", cor: amarelo}
  le:    {tipo: bloco, pos: [3, 3], texto: "Let's Encrypt<br>(CA pública)", cor: vermelho}
  inet:  {tipo: grupo, contem: [nav, dns], texto: "internet", cor: azul}
  rede:  {tipo: grupo, contem: [gw, cad, dist, api, db], texto: "EC2 · docker compose de produção · DNS pelo nome do serviço", cor: laranja}
arestas:
  - [nav.b, dns.c, {rotulo: "1. nome → IP"}]
  - [nav, sg, {rotulo: "2. HTTPS :443"}]
  - [sg, gw]
  - [gw.c, cad.e, {rotulo: ":443"}]
  - [cad, dist, {rotulo: "resto → dist/"}]
  - [cad.b, api.e, {rotulo: "/api/notes/* sem o /api<br>→ ichiro:8000"}]
  - [api, db, {rotulo: "postgres:5432"}]
  - [cad.b, le.c, {rotulo: "pede e renova<br>o certificado", tracejada: true, por: [3.0, 2.5]}]
legenda: {"dev → prod": "nome real em vez de .localhost; Let's Encrypt em vez de CA local; dist/ em vez do Vite; sem 5432 aberto", "lonzo": "o chat não vai para a AWS antes do login (M2)", "tracejada": "acontece de tempos em tempos, não a cada pedido"}
