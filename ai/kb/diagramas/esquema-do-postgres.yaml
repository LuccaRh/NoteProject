titulo: "Postgres do NoteProject: um container, três bancos, dez tabelas"
tipo: blocos
grade: [100, 10]
escuro: true
destino: Estrutura do projeto/Figuras
nos:
  # banco ichiro (verde)
  notes:
    tipo: tabela
    pos: [1.9, 19]
    w: 380
    texto: notes
    cor: verde
    colunas:
      - [id, uuid, PK]
      - [parent_id, uuid, FK, "null"]
      - [is_folder, boolean]
      - [title, text]
      - [body, text]
      - [created_at, timestamptz]
      - [updated_at, timestamptz]
      - [owner_id, uuid]
    extras:
      - [UQ, "(owner_id, parent_id, title) NULLS NOT DISTINCT"]
      - [ix, "notes_owner_id_idx (owner_id)"]
      - [ix, "notes_search_idx GIN to_tsvector(title, body)"]
      - [RLS, "notes_owner: owner_id = app.user_id"]
    nota: "Notas e pastas (is_folder) numa árvore; apagar a pasta apaga o que há dentro."
  alembic_i:
    tipo: tabela
    pos: [1.9, 42]
    w: 380
    texto: alembic_version
    cor: verde
    colunas:
      - [version_num, "varchar(32)", PK]
    nota: "Última migration aplicada."

  # banco nujabes (roxo)
  users:
    tipo: tabela
    pos: [16.9, 45]
    texto: users
    cor: roxo
    w: 270
    colunas:
      - [id, uuid, PK]
      - [email, text, UQ]
      - [password_hash, text]
      - [created_at, timestamptz]
    nota: "Quem pode entrar; a senha fica em hash (pgcrypto)."
  sessions:
    tipo: tabela
    pos: [16.9, 22]
    w: 270
    texto: sessions
    cor: roxo
    colunas:
      - [token_hash, bytea, PK]
      - [user_id, uuid, FK]
      - [created_at, timestamptz]
      - [expires_at, timestamptz]
    nota: "Só o hash do token: tabela vazada não dá login."
  alembic_n:
    tipo: tabela
    pos: [16.9, 7.2]
    texto: alembic_version
    cor: roxo
    w: 270
    colunas:
      - [version_num, "varchar(32)", PK]
    nota: "Última migration aplicada."

  # banco lonzo (azul)
  conversations:
    tipo: tabela
    pos: [7.9, 13]
    w: 380
    texto: conversations
    cor: azul
    colunas:
      - [id, uuid, PK]
      - [folder_id, uuid, "", "null"]
      - [title, text]
      - [created_at, timestamptz]
      - [updated_at, timestamptz]
      - [owner_id, uuid]
    extras:
      - [ix, "(owner_id, folder_id, updated_at)"]
      - [RLS, "conversations_owner: owner_id = app.user_id"]
    nota: "Uma conversa do chat, ligada à pasta do workspace (NULL = raiz)."
  messages:
    tipo: tabela
    pos: [12.5, 12.3]
    w: 380
    texto: messages
    cor: azul
    colunas:
      - [id, uuid, PK]
      - [conversation_id, uuid, FK]
      - [role, text]
      - [content, jsonb]
      - [created_at, timestamptz]
    extras:
      - [ix, "(conversation_id, id)"]
      - [CK, "role IN ('user', 'assistant')"]
      - [RLS, "messages_owner: a conversa é visível"]
    nota: "Blocos de conteúdo da Messages API, como foram enviados."
  settings:
    tipo: tabela
    pos: [7.9, 69]
    w: 380
    texto: settings
    cor: azul
    colunas:
      - [user_id, uuid, PK]
      - [api_key, bytea, "", "null"]
      - [key_end, text, "", "null"]
      - [model, text]
      - [max_tokens, integer]
      - [tools_max_turns, integer]
      - [thinking, text]
      - [show_workspace, boolean]
    extras:
      - [RLS, "settings_owner: user_id = app.user_id"]
    nota: "Uma linha por usuário; api_key cifrada (Fernet)."
  skills:
    tipo: tabela
    pos: [7.9, 41]
    w: 380
    texto: skills
    cor: azul
    colunas:
      - [id, uuid, PK]
      - [user_id, uuid]
      - [note_id, uuid]
      - [title, text]
      - [summary, text]
      - [body, text]
    extras:
      - [UQ, "(user_id, note_id)"]
      - [RLS, "skills_read: todo usuário logado lê"]
      - [RLS, "skills_owner: só o dono escreve"]
    nota: "Skill publicada: uma foto da nota de origem, copiada ao publicar."
  alembic_l:
    tipo: tabela
    pos: [12.5, 32.3]
    w: 380
    texto: alembic_version
    cor: azul
    colunas:
      - [version_num, "varchar(32)", PK]
    nota: "Última migration aplicada."

  ichiro_db: {tipo: grupo, contem: [notes, alembic_i], texto: "banco ichiro (notas)", cor: verde, forte: true, folga: 40}
  lonzo_db: {tipo: grupo, contem: [conversations, messages, skills, settings, alembic_l], texto: "banco lonzo (chat com IA)", cor: azul, forte: true}
  nujabes_db: {tipo: grupo, contem: [users, sessions, alembic_n], texto: "banco nujabes (login)", cor: roxo, forte: true, folga: 40}
arestas:
  # FK de verdade, na cor do banco
  - [sessions.d:user_id, users.d:id, {pontas: [ERmany, ERmandOne], cor: roxo, coluna: 18.6}]
  - [messages.e:conversation_id, conversations.d:id, {pontas: [ERmany, ERmandOne], cor: azul}]
  - [notes.e:parent_id, notes.e:id, {pontas: [ERmany, ERzeroToOne], cor: verde, coluna: -0.2}]
  # referência lógica: sai do alvo, para os tracejados que se sobrepõem casarem
  - [notes.d:id, conversations.e:folder_id, {pontas: [ERzeroToOne, ERmany], tracejada: true, cor: verde, coluna: 5.3}]
  - [notes.d:id, skills.e:note_id, {pontas: [ERmandOne, ERmany], tracejada: true, cor: verde, coluna: 5.3}]
  - [users.e:id, conversations.d:owner_id, {pontas: [ERmandOne, ERmany], tracejada: true, cor: roxo, coluna: 10.2}]
  - [users.e:id, skills.d:user_id, {pontas: [ERmandOne, ERmany], tracejada: true, cor: roxo, coluna: 10.2}]
  - [users.e:id, settings.d:user_id, {pontas: [ERmandOne, ERzeroToOne], tracejada: true, cor: roxo, coluna: 10.2}]
  - [users.e:id, notes.d:owner_id, {pontas: [ERmandOne, ERmany], tracejada: true, cor: roxo, pontos: [[10.2, 86], [4.8, 86], [4.8, 21.6]]}]
legenda:
  "Linha contínua": "FK de verdade, dentro do banco, ON DELETE CASCADE"
  "Tracejada verde": "referência só lógica: guarda o id de uma nota do ichiro, sem FK"
  "Tracejada roxa": "referência só lógica: guarda o id de um usuário do nujabes, sem FK"
