arestas:
  - [nav, proxy, {rotulo: "HTTPS :443"}]
  - [term, proxy, {rotulo: "TCP :5432<br>HTTPS :443"}]
  - [proxy, gw, {rotulo: "TCP novo,<br>origem .1"}]
  - [gw, cad, {rotulo: ":443"}]
  - [cad.c, web.e, {rotulo: "resto → chimchar:5173"}]
  - [cad, nuj, {rotulo: "/api/auth/* e<br>forward_auth"}]
  - [cad, api, {rotulo: "/api/notes/*<br>→ ichiro"}]
  - [cad.b, lonzo.e, {rotulo: "/api/chat/*<br>→ lonzo:8000"}]
  - [lonzo.c, api.b, {rotulo: "HTTP ichiro:8000 (IchiroClient)<br>GET /notes, /{id}, /by-path,<br>/search, /search-titles<br>POST · PATCH · DELETE /notes"}]
