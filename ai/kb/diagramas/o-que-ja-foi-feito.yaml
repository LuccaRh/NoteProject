  - [ws, vault, {rotulo: "sync"}]
legenda: {"✅": "PR mergeado", "⏳": "branch pronta ou PR aberto, sem merge", "loopback": "outro aparelho na rede de casa não alcança", "Caddy": "lê o nome (SNI/Host) e escolhe o bloco notes.localhost; corta o /api antes de repassar; outro /api/* → 404", "IP": "o Docker sorteia a cada subida (aqui, 2026-11-03; o do nujabes varia)"}
