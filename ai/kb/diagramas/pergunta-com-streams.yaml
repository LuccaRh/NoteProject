titulo: "Uma pergunta por dentro: turnos, blocos, eventos e ferramentas"
tipo: blocos
grade: [370, 105]
destino: IA no projeto/Figuras
nos:
  cnav: {tipo: bloco, pos: [0, -1], texto: "<b>Navegador</b> (chimchar)", cor: azul}
  clon: {tipo: bloco, pos: [1, -1], texto: "<b>lonzo</b> (events + tool_runner)", cor: verde}
  cant: {tipo: bloco, pos: [2, -1], texto: "<b>Anthropic</b> (modelo)", cor: laranja}
  cich: {tipo: bloco, pos: [3, -1], texto: "<b>ichiro</b> + Postgres", cor: amarelo}

  n1:   {tipo: bloco, pos: [0, 0], texto: "1. 'Já tem nota de TLS?<br>Se não, cria uma'", cor: azul}
  l1:   {tipo: bloco, pos: [1, 0], texto: "2. monta o pacote:<br>system + tools + histórico + pergunta", cor: verde}
  a1:   {tipo: bloco, pos: [2, 0], texto: "3. modelo lê o pacote<br>e começa a responder", cor: laranja}

  a2:   {tipo: bloco, pos: [2, 1], texto: "bloco 1, text:<br>'Vou procurar'", cor: laranja}
  l2:   {tipo: bloco, pos: [1, 1], texto: "evento text", cor: verde}
  n2:   {tipo: bloco, pos: [0, 1], texto: "aparece o texto", cor: azul}

  a3:   {tipo: bloco, pos: [2, 2], texto: "bloco 2, tool_use começa:<br>name = search_notes, input = {}", cor: laranja}
  l3:   {tipo: bloco, pos: [1, 2], texto: "evento content_block_start", cor: verde}
  n3:   {tipo: bloco, pos: [0, 2], texto: "status: search_notes", cor: azul}

  a4:   {tipo: bloco, pos: [2, 3], texto: "bloco 2 termina:<br>input = {query: 'TLS'}<br>stop_reason = tool_use", cor: laranja}
  l4:   {tipo: bloco, pos: [1, 3], texto: "evento content_block_stop", cor: verde}
  n4:   {tipo: bloco, pos: [0, 3], texto: "status: search_notes, TLS", cor: azul}

  r1:   {tipo: bloco, pos: [1, 4], texto: "4. stream 1 acabou: tool_runner roda<br>search_notes(query='TLS')", cor: verde}
  i1:   {tipo: bloco, pos: [3, 4], texto: "5. busca no Postgres:<br>nenhuma nota", cor: amarelo}

  l5:   {tipo: bloco, pos: [1, 5], texto: "6. pacote anterior + tool_use<br>+ tool_result 'no notes found'", cor: verde}
  a5:   {tipo: bloco, pos: [2, 5], texto: "7. modelo vê que não tem<br>e decide criar", cor: laranja}

  a6:   {tipo: bloco, pos: [2, 6], texto: "bloco 1, tool_use começa:<br>name = create_note, input = {}", cor: laranja}
  l6:   {tipo: bloco, pos: [1, 6], texto: "evento content_block_start", cor: verde}
  n6:   {tipo: bloco, pos: [0, 6], texto: "status: create_note", cor: azul}

  a7:   {tipo: bloco, pos: [2, 7], texto: "bloco 1 termina:<br>input = {path: 'TLS', body: '...'}<br>stop_reason = tool_use", cor: laranja}
  l7:   {tipo: bloco, pos: [1, 7], texto: "evento content_block_stop", cor: verde}
  n7:   {tipo: bloco, pos: [0, 7], texto: "status: create_note, TLS", cor: azul}

  r2:   {tipo: bloco, pos: [1, 8], texto: "8. stream 2 acabou: tool_runner roda<br>create_note(path='TLS', body='...')", cor: verde}
  i2:   {tipo: bloco, pos: [3, 8], texto: "9. grava a nota<br>no Postgres", cor: amarelo}

  l9:   {tipo: bloco, pos: [1, 9], texto: "10. pacote anterior + tool_use<br>+ tool_result 'created TLS'", cor: verde}
  a9:   {tipo: bloco, pos: [2, 9], texto: "11. modelo vê que acabou", cor: laranja}

  a10:  {tipo: bloco, pos: [2, 10], texto: "bloco 1, text:<br>'Não tinha; criei a nota TLS'<br>stop_reason = end_turn", cor: laranja}
  l10:  {tipo: bloco, pos: [1, 10], texto: "evento text", cor: verde}
  n10:  {tipo: bloco, pos: [0, 10], texto: "aparece o texto", cor: azul}

  l11:  {tipo: bloco, pos: [1, 11], texto: "12. sem ferramenta: o laço acaba;<br>grava pergunta e resposta (banco lonzo)", cor: verde}
  n11:  {tipo: bloco, pos: [0, 11], texto: "fim da resposta", cor: azul}

  t1:   {tipo: grupo, contem: [l1, a1, l2, a2, l3, a3, l4, a4], texto: "Stream 1", cor: cinza}
  t2:   {tipo: grupo, contem: [l5, a5, l6, a6, l7, a7], texto: "Stream 2", cor: cinza}
  t3:   {tipo: grupo, contem: [l9, a9, l10, a10], texto: "Stream 3", cor: cinza}
arestas:
  - [n1, l1, {rotulo: "POST<br>/api/chat"}]
  - [l1, a1, {rotulo: "request 1"}]
  - [a2, l2]
  - [l2, n2, {rotulo: "text_delta"}]
  - [a3, l3]
  - [l3, n3, {rotulo: "tool_use"}]
  - [a4, l4]
  - [l4, n4, {rotulo: "tool_use"}]
  - [l4, r1]
  - [r1, i1, {rotulo: "GET /notes/search"}]
  - [r1, l5]
  - [l5, a5, {rotulo: "request 2"}]
  - [a6, l6]
  - [l6, n6, {rotulo: "tool_use"}]
  - [a7, l7]
  - [l7, n7, {rotulo: "tool_use"}]
  - [l7, r2]
  - [r2, i2, {rotulo: "POST /notes"}]
  - [r2, l9]
  - [l9, a9, {rotulo: "request 3"}]
  - [a10, l10]
  - [l10, n10, {rotulo: "text_delta"}]
  - [l10, l11]
  - [l11, n11, {rotulo: "message_end"}]
legenda:
  stream: "um turno do modelo: a resposta inteira de uma request"
  bloco: "uma parte da resposta: um text ou um tool_use"
  evento: "um pedacinho do stream; começo e fim de bloco são eventos"
  input: "os argumentos da ferramenta, em JSON, escolhidos pelo modelo"
