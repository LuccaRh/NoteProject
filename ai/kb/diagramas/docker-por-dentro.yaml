titulo: Docker por dentro
tipo: blocos
grade: [250, 120]
destino: Conceitos/Figuras
nos:
  yml:   {tipo: bloco, pos: [0, 0], texto: "docker-compose-dev.yml", cor: cinza}
  env:   {tipo: bloco, pos: [0, 1], texto: ".env<br>POSTGRES_*=…", cor: vermelho}
  code:  {tipo: bloco, pos: [0, 2], texto: "./apps/notes<br>(o código)", cor: azul}
  pc:    {tipo: grupo, contem: [yml, env, code], texto: "pasta do projeto no PC", cor: cinza}
  up:    {tipo: bloco, pos: [1, 1], texto: "docker compose up<br>(roda no PC)", cor: roxo}
  hub:   {tipo: bloco, pos: [4, 0], texto: "Docker Hub<br>(imagens públicas)", cor: cinza}
  inot:  {tipo: bloco, pos: [2, 1], texto: "imagem notes<br>(build do Dockerfile.dev)", cor: roxo}
  ipg:   {tipo: bloco, pos: [4, 1], texto: "imagem postgres:18<br>(baixada no 1º up)", cor: roxo}
  cnot:  {tipo: bloco, pos: [2, 2], texto: "container notes<br>camada própria: some no down<br>env: POSTGRES_*", cor: verde}
  cpg:   {tipo: bloco, pos: [4, 2], texto: "container postgres<br>camada própria: some no down<br>env: POSTGRES_*", cor: amarelo}
  vven:  {tipo: bloco, pos: [2, 3], texto: "volume anônimo → /app/.venv<br>vazio: recebe as libs da imagem", cor: roxo}
  vdb:   {tipo: banco, pos: [4, 3], texto: "volume noteproject_db<br>→ /var/lib/postgresql<br>vazio: initdb preenche", cor: amarelo}
  dk:    {tipo: grupo, contem: [inot, ipg, cnot, cpg, vven, vdb], texto: "/var/lib/docker: uma por máquina, todos os projetos", cor: cinza}
arestas:
  - [yml.d, up.c, {rotulo: "lê"}]
  - [env, up, {rotulo: "lê .env"}]
  - [up, inot, {rotulo: "build"}]
  - [hub, ipg, {rotulo: "pull"}]
  - [inot, cnot, {rotulo: "cria"}]
  - [ipg, cpg, {rotulo: "cria"}]
  - [code, cnot, {rotulo: "bind mount → /app"}]
  - [vven, cnot, {rotulo: "monta"}]
  - [vdb, cpg, {rotulo: "monta"}]
  - [cnot, cpg, {rotulo: "postgres:5432", tracejada: true}]
legenda:
  "down": "apaga os containers; imagens e volumes ficam (down -v apaga os volumes)"
  "web": "igual ao notes: build, bind mount ./apps/web e volume anônimo /app/node_modules"
