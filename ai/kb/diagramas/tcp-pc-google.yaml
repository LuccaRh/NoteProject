titulo: Ida e volta de um pacote entre o notebook e o Google
tipo: blocos
grade: [255, 125]
destino: Conceitos/Figuras
nos:
  pc:   {tipo: bloco, pos: [0, 0], texto: "notebook<br>192.168.15.156", cor: azul}
  rot:  {tipo: bloco, pos: [1, 0], texto: "roteador de casa<br>dentro: 192.168.15.1<br>fora: 203.0.113.7 (ex.)", cor: roxo}
  op:   {tipo: bloco, pos: [2, 0], texto: "roteador da operadora<br>203.0.113.1 (ex.)", cor: cinza}
  tr:   {tipo: bloco, pos: [3, 0], texto: "roteador de trânsito<br>198.51.100.1 (ex.)", cor: cinza}
  goo:  {tipo: bloco, pos: [4, 0], texto: "Google<br>142.250.79.36 (ex.)<br>porta 443", cor: laranja}
  t_pc:  {tipo: nota, pos: [0, 1], texto: "<b>rotas</b><br>192.168.15.0/24 → direto<br>default → 192.168.15.1"}
  t_rot: {tipo: nota, pos: [1, 1], texto: "<b>rotas</b><br>192.168.15.0/24 → direto<br>default → operadora"}
  t_op:  {tipo: nota, pos: [2, 1], texto: "<b>rotas</b> (~1 milhão de blocos)<br>142.250.0.0/15 → trânsito<br>203.0.113.0/24 → clientes"}
  t_tr:  {tipo: nota, pos: [3, 1], texto: "<b>rotas</b> (~1 milhão de blocos)<br>142.250.0.0/15 → Google<br>203.0.113.0/24 → operadora"}
  t_goo: {tipo: nota, pos: [4, 1], texto: "<b>rotas</b><br>142.250.79.0/24 → direto<br>default → trânsito"}
  pc2:  {tipo: bloco, pos: [0, 3], texto: "notebook<br>192.168.15.156", cor: azul}
  rot2: {tipo: bloco, pos: [1, 3], texto: "roteador de casa<br>(NAT desfaz a troca)", cor: roxo}
  op2:  {tipo: bloco, pos: [2, 3], texto: "roteador da operadora", cor: cinza}
  tr2:  {tipo: bloco, pos: [3, 3], texto: "outro roteador<br>de trânsito (pode ser)", cor: cinza}
  goo2: {tipo: bloco, pos: [4, 3], texto: "Google", cor: laranja}
  nat:  {tipo: nota, pos: [1, 4], texto: "<b>tabela do NAT</b><br>203.0.113.7:51234 ⇄ 192.168.15.156:51234"}
  ida:  {tipo: grupo, contem: [pc, rot, op, tr, goo, t_pc, t_rot, t_op, t_tr, t_goo], texto: "ida", cor: cinza}
  volta: {tipo: grupo, contem: [pc2, rot2, op2, tr2, goo2, nat], texto: "volta", cor: cinza}
arestas:
  - [pc, rot, {rotulo: "A"}]
  - [rot, op, {rotulo: "B"}]
  - [op, tr]
  - [tr, goo]
  - [goo2, tr2, {rotulo: "C"}]
  - [tr2, op2]
  - [op2, rot2]
  - [rot2, pc2, {rotulo: "D"}]
legenda:
  "A": "origem 192.168.15.156:51234 → destino 142.250.79.36:443 (IP privado, só vale no wi-fi)"
  "B": "o NAT troca só a origem: 203.0.113.7:51234 → 142.250.79.36:443; daqui até o Google nada muda no pacote"
  "rotas": "cada roteador olha só o destino, acha o bloco mais específico que o contém na própria tabela e manda ao vizinho daquela linha"
  "C": "pacote novo: origem 142.250.79.36:443 → destino 203.0.113.7:51234; roteado do zero, pode seguir outro caminho"
  "D": "o NAT acha a porta 51234 na tabela e troca o destino por 192.168.15.156:51234"
  "ex.": "IPs e blocos ilustrativos (faixas de documentação 203.0.113.x e 198.51.100.x)"
  "fonte": "rotas do notebook: ip route em 2026-10-24; o resto (geral)"
