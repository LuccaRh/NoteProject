<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <link rel="icon" href="/favicon.svg" />
        <title>Notes</title>
    </head>

    <body>
        <div class="app">

            <!-- Sidebar: buttons, tree of notes and server status -->
            <aside class="sidebar" aria-label="Notes">

                <!-- Buttons to create a note or a folder -->
                <div class="toolbar">
                    <button id="new-note" class="icon" aria-label="New note"
                        title="New note">
                        <svg aria-hidden="true" width="16" height="16"
                            viewBox="0 0 24 24" fill="none"
                            stroke="currentColor"
                            stroke-width="1.8" stroke-linecap="round"
                            stroke-linejoin="round">
                            <path
                                d="M14 3H6v18h12V7zM14 3v4h4M12 11v6M9 14h6" />
                        </svg>
                    </button>

                    <button id="new-folder" class="icon" aria-label="New folder"
                        title="New folder">
                        <svg aria-hidden="true" width="16" height="16"
                            viewBox="0 0 24 24" fill="none"
                            stroke="currentColor"
                            stroke-width="1.8" stroke-linecap="round"
                            stroke-linejoin="round">
                            <path d="M3 6h6l2 2h10v11H3zM12 11v5M9.5 13.5h5" />
                        </svg>
                    </button>

                    <button id="new-chat" class="icon" aria-label="New chat"
                        title="New chat">
                        <svg aria-hidden="true" width="16" height="16"
                            viewBox="0 0 24 24" fill="none"
                            stroke="currentColor"
                            stroke-width="1.8" stroke-linecap="round"
                            stroke-linejoin="round">
                            <path d="M4 5h16v11H9l-5 4zM8 9h8M8 12h5" />
                        </svg>
                    </button>

                    <button id="new-workspace" class="icon"
                        aria-label="Create workspace" title="Create workspace">
                        <svg aria-hidden="true" width="16" height="16"
                            viewBox="0 0 24 24" fill="none"
                            stroke="currentColor"
                            stroke-width="1.8" stroke-linecap="round"
                            stroke-linejoin="round">
                            <path d="M4 4h7v7H4zM13 4h7v7h-7zM4 13h7v7H4z
                                M16.5 13v7M13 16.5h7" />
                        </svg>
                    </button>
                </div>

                <!-- Tree of notes, filled by notes/tree.ts -->
                <ul id="tree" class="tree" role="tree" aria-label="Notes"></ul>

                <!-- Whether the notes service answered -->
                <p id="server-status" class="status" role="status">Loading</p>

            </aside>

            <!-- Work area: the tab bar and the panel of the active tab -->
            <div id="work" class="work">

                <!-- Open notes and chats, filled by tabs.ts -->
                <div id="tabs" class="tabs" role="tablist"
                    aria-label="Open tabs" hidden></div>

                <!-- Page: the open note, driven by notes/page.ts -->
                <main id="note-panel" class="page">
                    <div class="column">

                        <!-- Path of the open note and save status -->
                        <div class="topbar">
                            <span id="path"></span>
                            <span id="save-status" role="status"></span>
                        </div>

                        <!-- Shown while no note is open -->
                        <p id="empty" class="empty">
                            Open a note or create one.
                        </p>

                        <!-- The open note: title and CodeMirror editor -->
                        <div id="note" hidden>
                            <input id="title" class="title" aria-label="Title"
                                placeholder="Untitled" />
                            <div id="editor"></div>
                        </div>

                    </div>
                </main>

                <!-- Chat tabs add their panels here, from chat/chat.ts -->
            </div>

        </div>

        <!-- Create workspace: folder and description, driven by
            chat/workspace-dialog.ts -->
        <dialog id="workspace-dialog" class="dialog"
            aria-labelledby="workspace-heading">
            <form id="workspace-form" class="dialog-form">
                <h2 id="workspace-heading">Create workspace</h2>

                <label for="workspace-folder">Folder</label>
                <select id="workspace-folder"></select>

                <label for="workspace-description">
                    What you want from it
                </label>
                <textarea id="workspace-description" rows="18"></textarea>

                <!-- Waiting for the AI, or what went wrong -->
                <p id="workspace-status" class="status" role="status"></p>

                <div class="dialog-actions">
                    <button id="workspace-cancel" type="button">
                        Cancel
                    </button>
                    <button id="workspace-create" type="submit">
                        Create
                    </button>
                </div>
            </form>
        </dialog>

        <!-- Search notes and folders, driven by notes/search.ts -->
        <dialog id="search-dialog" class="search" aria-label="Search">
            <div class="search-bar">
                <!-- Folder the search stays inside, when there is one -->
                <span id="search-scope" class="search-scope" hidden>
                    <span id="search-scope-path"></span>
                    <button id="search-scope-clear" type="button"
                        aria-label="Search everywhere"
                        title="Search everywhere">&times;</button>
                </span>
                <input id="search-input" class="search-input"
                    aria-label="Search" autocomplete="off"
                    aria-controls="search-results" />

                <!-- Everything (names and bodies) or titles only -->
                <div class="search-modes" role="group" aria-label="Search in">
                    <button id="search-mode-all" type="button"
                        aria-pressed="true">Everything</button>
                    <button id="search-mode-titles" type="button"
                        aria-pressed="false">Titles</button>
                </div>
            </div>

            <ul id="search-results" class="search-results"
                role="listbox"></ul>

            <p class="search-hints">
                <span><kbd>&uarr;&darr;</kbd> to navigate</span>
                <span><kbd>&crarr;</kbd> to open</span>
                <span><kbd>&crarr;</kbd> on a folder to search in it</span>
                <span><kbd>&#9003;</kbd> to go up a folder</span>
                <span><kbd>alt t</kbd> titles only</span>
            </p>
        </dialog>

        <script type="module" src="/src/main.ts"></script>
    </body>
</html>
