[project]
name = "lonzo"
version = "0.17.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.20.1",
    "anthropic>=2.3.0",
    "cryptography>=50.0.2",
    "fastapi[standard]>=0.162.0",
    "httpx2>=2.16.0",
    "psycopg[binary]>=3.3.6",
    "sqlalchemy[asyncio]>=2.1.6",
]

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]

[tool.ruff]
line-length = 80

[tool.ruff.lint]
extend-select = ["E501"]

# Two blank lines between imports and the globals (CLAUDE.md, W16)
[tool.ruff.lint.isort]
lines-after-imports = 2

[tool.mypy]
strict = true
