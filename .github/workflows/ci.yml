name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  chimchar:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/chimchar
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/chimchar/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run build

  ichiro:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          # Throwaway database: no password to keep out of git
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 2s
          --health-retries 15
    env:
      ICHIRO_DATABASE_URL: postgresql+psycopg://ichiro@localhost:5432/ichiro
      ICHIRO_MIGRATION_URL: >-
        postgresql+psycopg://ichiro_migrator@localhost:5432/ichiro
      PGHOST: localhost
      POSTGRES_USER: postgres
      POSTGRES_DB: postgres
      ICHIRO_DB_PASSWORD: ci
      ICHIRO_MIGRATOR_PASSWORD: ci
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          version: "0.13.5"
      - run: sh postgres/init/create-ichiro-database.sh
      - run: make check-ichiro

  lonzo:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          # Throwaway database: no password to keep out of git
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 2s
          --health-retries 15
    env:
      LONZO_DATABASE_URL: >-
        postgresql+psycopg://lonzo@localhost:5432/lonzo
      LONZO_MIGRATION_URL: >-
        postgresql+psycopg://lonzo_migrator@localhost:5432/lonzo
      PGHOST: localhost
      POSTGRES_USER: postgres
      POSTGRES_DB: postgres
      LONZO_DB_PASSWORD: ci
      LONZO_MIGRATOR_PASSWORD: ci
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          version: "0.13.5"
      - run: sh postgres/init/create-lonzo-database.sh
      - run: make check-lonzo

  nujabes:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          # Throwaway database: no password to keep out of git
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 2s
          --health-retries 15
    env:
      NUJABES_DATABASE_URL: >-
        postgresql+psycopg://postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          version: "0.13.5"
      - run: make check-nujabes

  tools:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyyaml
      - run: python3 ai/tools/np.py test
